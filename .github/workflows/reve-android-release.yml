name: REVE Android verified Play upload AAB (authorized key only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JKS_BASE64: ${{ secrets.REVE_UPLOAD_JKS_BASE64 }}
      REVE_UPLOAD_STORE_PASSWORD: ${{ secrets.REVE_UPLOAD_STORE_PASSWORD }}
      REVE_UPLOAD_KEY_ALIAS: ${{ secrets.REVE_UPLOAD_KEY_ALIAS }}
      REVE_UPLOAD_KEY_PASSWORD: ${{ secrets.REVE_UPLOAD_KEY_PASSWORD }}
      REVE_UPLOAD_CERT_SHA256: ${{ secrets.REVE_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Play signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for key in JKS_BASE64 REVE_UPLOAD_STORE_PASSWORD REVE_UPLOAD_KEY_ALIAS REVE_UPLOAD_KEY_PASSWORD REVE_UPLOAD_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing GitHub Actions secret $key; cannot issue a signed AAB"; exit 1; fi
          done
          echo "Required credentials present; secret values are never printed."
      - name: Locate Android SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          SDK_BIN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDK_BIN")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed release and verify Play upload certificate
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          mkdir -p "$RUNNER_TEMP/reve-keystore"
          chmod 700 "$RUNNER_TEMP/reve-keystore"
          printf '%s' "$JKS_BASE64" | base64 -d > "$RUNNER_TEMP/reve-keystore/upload.jks"
          chmod 600 "$RUNNER_TEMP/reve-keystore/upload.jks"
          REVE_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/reve-keystore/upload.jks" gradle -p apps/android --no-daemon :app:bundleRelease
          bash apps/android/tests/verify-play-aab.sh apps/android/app/build/outputs/bundle/release/app-release.aab | tee release-verification.txt
      - name: Upload verified AAB (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: REVE-verified-Play-upload-AAB
          retention-days: 1
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            release-verification.txt
      - name: Delete temporary upload key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/reve-keystore/upload.jks"
